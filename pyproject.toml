[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "toi-contam"
version = "0.1.0"
description = "TESS contamination analysis"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "pandas",
  "scipy",
  "matplotlib",
  "astropy",
  "astroquery",
  "photutils",
  "lightkurve",
  "alive-progress",
]

[project.scripts]
toi-contam = "toi_contam.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
